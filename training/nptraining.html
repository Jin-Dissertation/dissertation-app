<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Self-Guided Training Module — Coming Soon</title>
  <style>
    :root { --bg: #f6f2e8; --card: #ffffff; --text: #30291b; --muted: #625b4b; --accent: #496b4f; --border: #dfd4bd; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 620px); padding: clamp(24px, 5vw, 44px); border: 1px solid var(--border); border-radius: 16px; background: var(--card); box-shadow: 0 6px 24px rgba(70, 52, 19, 0.06); }
    .eyebrow { color: var(--accent); font-size: 0.78rem; letter-spacing: .075em; text-transform: uppercase; font-weight: 750; }
    h1 { margin: 12px 0 16px; font-size: clamp(1.7rem, 5vw, 2.2rem); line-height: 1.2; }
    p { color: var(--muted); line-height: 1.65; }
    .return { display: inline-flex; align-items: center; min-height: 44px; padding: 12px 18px; margin-top: 12px; border-radius: 9px; color: white; background: var(--accent); font-weight: 700; text-decoration: none; }
    .return:hover, .return:focus-visible { background: #38543f; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Non-Participant Version</div>
    <h1>Self-guided training module — coming soon</h1>
    <p>The non-participant training module is still being developed. You can use the question-writing app now; no training module or participant code is required.</p>
    <a class="return" href="../np/npindex.html">Return to the question-writing app →</a>
  </main>
</body>
</html>
